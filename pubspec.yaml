name: flutter_test_logger
description: "Captain's Journal - A simple app for keeping a diary and notes."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the package dependencies and the app version should be updated as needed.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dev_dependencies:
  flutter_launcher_icons: "^0.13.1"
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.1.1
  drift: ^2.32.1
  drift_flutter: ^0.2.8

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icons/img.png" # путь к твоей иконке

flutter:
  uses-material-design: true
