name: flutter_test_logger
description: "Captain's Journal - A simple app for keeping a diary and notes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dev_dependencies:
  flutter_launcher_icons: "^0.13.1"
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.1.1
  drift: ^2.32.1
  drift_flutter: ^0.2.8
  uuid: ^4.5.1

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icons/img.png"

flutter:
  uses-material-design: true
